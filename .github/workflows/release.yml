# ==================================================================
#  ReplyMate — secure release workflow (P-release-2)
#
#  Uses GitHub Actions secrets REPLYMATE_KEYSTORE_B64 + REPLYMATE_KEYSTORE_PASS.
#  HARD RULES ENCODED HERE:
#   * keystore bytes exist ONLY as a runner-temp file, shredded at the end
#   * password never printed / never logged; its WORKING shape (whitespace
#     injuries healed) lives only in a 0600 runner-temp file, shredded at the end
#   * signing REFUSES to run unless the keystore certificate matches the
#     historical ReplyMate identity (B15F2F37…6A85ED), byte-for-byte
#   * the produced APK is refused unless IT carries that same certificate
#   * GITHUB_TOKEN gets read-only contents perms; nothing is committed back
#
#  Trigger: Actions → release → Run workflow (main only). CI proof builds use
#  vc900+ names like 1.5.8-ci-proof so the ledger series (…39, 40, …) stays
#  clean for real releases, which ship via scripts/release.sh + REPLYMATE_JKS
#  per docs/signing-key-migration.md once the device gate is green.
# ==================================================================
name: release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (integer; real releases: next after 39)"
        required: true
      version_name:
        description: "versionName (e.g. 1.5.9; CI proofs: 1.5.8-ci-proof)"
        required: true
      notes:
        description: "notes (job summary only)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: replymate-release
  cancel-in-progress: false

env:
  # Public information — printed on every shipped APK since 1.4.6.
  HISTORICAL_FINGERPRINT: "B1:5F:2F:37:FC:E1:9B:56:46:83:FE:6B:85:72:5A:9D:31:92:DF:93:18:1E:F2:F3:62:86:B5:E2:1C:6A:85:ED"

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: JVM release gate
        run: bash scripts/run_tests.sh

      - name: Materialize keystore (runner-temp file ONLY, never logged)
        env:
          RM_KS_B64: ${{ secrets.REPLYMATE_KEYSTORE_B64 }}
          RM_KS_PASS: ${{ secrets.REPLYMATE_KEYSTORE_PASS }}
          KS_OUT: ${{ runner.temp }}/arena.keystore
        run: |
          set -euo pipefail
          echo "::add-mask::$RM_KS_B64"
          chmod 600 "$KS_OUT" 2>/dev/null || true
          python3 - "$KS_OUT" <<'PYEOF'
          import base64, binascii, os, sys
          from urllib.parse import unquote
          s = "".join(os.environ["RM_KS_B64"].split())          # strip whitespace
          s = s.strip('"').strip("'")                           # copy-paste quotes
          def try_decode(x):
              for cand in (x, x.replace("-", "+").replace("_", "/")):   # std then b64url
                  cand += "=" * (-len(cand) % 4)                        # re-pad
                  try:
                      return base64.b64decode(cand, validate=True)
                  except binascii.Error:
                      continue
              return None
          def jks_ok(data):
              # full JKS structural walk (no password needed to parse): magic, version 2,
              # entry walk (alias/ts/encrypted-key/cert-chain), trailing 20-byte integrity digest.
              import struct
              try:
                  if data[:4] != bytes.fromhex("feedfeed"): return False
                  off = 8  # magic + version(2)
                  count = struct.unpack(">I", data[off:off+4])[0]; off += 4
                  if not 1 <= count <= 10000: return False
                  def utf(d, o):
                      ln = struct.unpack(">H", d[o:o+2])[0]
                      return o + 2 + ln
                  for _ in range(count):
                      tag = struct.unpack(">I", data[off:off+4])[0]; off += 4
                      if tag == 1:                       # private-key entry
                          off = utf(data, off)           # alias
                          off += 8                        # timestamp
                          klen = struct.unpack(">I", data[off:off+4])[0]; off += 4 + klen
                          nc = struct.unpack(">I", data[off:off+4])[0]; off += 4
                          if not 1 <= nc <= 1000: return False
                          for _ in range(nc):
                              off = utf(data, off)        # cert type
                              clen = struct.unpack(">I", data[off:off+4])[0]; off += 4 + clen
                      elif tag == 2:                     # trusted-cert entry
                          off = utf(data, off); off += 8
                          off = utf(data, off)
                          clen = struct.unpack(">I", data[off:off+4])[0]; off += 4 + clen
                      else:
                          return False
                      if off > len(data): return False
                  return len(data) - off == 20            # SHA-1 integrity digest trails the store
              except Exception:
                  return False
          def jks_digest_ok(data, pw):
              # JKS integrity digest (OpenJDK legacy JKS): SHA-1 over
              # password(UTF-16BE) + "Mighty Aphrodite" + store-bytes[:-20] == trailing 20 bytes.
              # Cryptographically identifies the ONE true reconstruction — structure alone cannot,
              # because a late paste injury hides inside the opaque encrypted-key blob yet keeps
              # the original trailing digest bytes.
              import hashlib
              if len(data) < 20:
                  return False
              try:
                  t = hashlib.sha1(pw.encode("utf-16-be") + b"Mighty Aphrodite" + data[:-20]).digest()
                  return t == data[-20:]
              except Exception:
                  return False
          RAW_PW = os.environ.get("RM_KS_PASS", "")
          PW_SHAPES = []                                   # paste injuries hit passwords too
          for _c in (RAW_PW, RAW_PW.rstrip("\r\n"), RAW_PW.strip()):
              if _c != "" and _c not in PW_SHAPES:
                  PW_SHAPES.append(_c)
          PW_USED = None
          def jks_digest_any(data):
              # the password SHAPE that validates the store's integrity digest, else None
              for pw in PW_SHAPES:
                  if jks_digest_ok(data, pw):
                      return pw
              return None
          cands = [s]
          if "," in s[:64] and "base64" in s[:64].lower():      # data-URI paste
              cands.append(s.split(",", 1)[1])
          u = unquote(s)                                        # URL-escaped paste (%2B/%2F/%3D)
          if u != s: cands.append(u)
          lite = s.replace("\\n", "").replace("\\r", "")        # literal \n paste
          if lite != s: cands.append(lite)
          data = None
          for c in cands:
              data = try_decode(c)
              if data is not None:
                  break
          if data is None:
              # paste-injury recovery: exactly one stray/duplicated char (N≡1 mod 4).
              # The JKS INTEGRITY DIGEST (keyed by RM_KS_PASS, whitespace shapes tolerated)
              # arbitrates the ONE true winner — structure alone is provably insufficient
              # for injuries inside the encrypted blob; unlock + fingerprint gates stay
              # fail-closed after this regardless.
              for c in cands:
                  if len(c) % 4 != 1 or not PW_SHAPES:
                      continue        # needs a password to arbitrate — else fail closed below
                  for k in range(len(c)):
                      d = try_decode(c[:k] + c[k+1:])
                      if d is not None and jks_ok(d):
                          pw_hit = jks_digest_any(d)
                          if pw_hit is not None:
                              data, PW_USED = d, pw_hit
                              print(f"::warning::secret auto-recovered by removing 1 stray character (paste position {k}); re-paste a clean 'base64 -w0 arena.keystore' output next rotation")
                              break
                  if data is not None:
                      break
          if data is None:
              print("::error::REPLYMATE_KEYSTORE_B64 is not valid base64/base64url after whitespace/quote/data-URI/URL-escape normalization.")
              # content-free DECISIVE diagnostic scan over the single-deletion space
              n_jks = 0
              head_class = None
              for c in cands:
                  if len(c) % 4 != 1:
                      continue
                  probe = try_decode(c[:-1])      # head bytes preserved unless the stray sits in the first 6 chars
                  if probe is not None and head_class is None:
                      head_class = ("JKS" if probe[:4] == bytes.fromhex("feedfeed")
                                    else "PKCS12/DER blob" if probe[:2] == b"0\x82"
                                    else "PEM text" if probe[:5] == b"-----"
                                    else "unrecognized bytes")
                  for k in range(len(c)):
                      d = try_decode(c[:k] + c[k+1:])
                      if d is not None and jks_ok(d):
                          n_jks += 1
              if n_jks > 0 and not PW_SHAPES:
                  print(f"::error::  diagnosis: {n_jks} single-deletion reconstruction(s) ARE structurally valid JKS, but REPLYMATE_KEYSTORE_PASS is unset/empty — digest arbitration is impossible without the password. Set the password secret; the stray character itself is auto-healable once it is.")
              elif n_jks > 0:
                  print(f"::error::  diagnosis: {n_jks} single-deletion reconstruction(s) ARE structurally valid JKS — but the integrity digest matches NONE of the password shapes tried. So either REPLYMATE_KEYSTORE_PASS is not this keystore's password, or the paste carries MORE than one stray character. (The digest is keyed by the password; a wrong password can never validate a right store.)")
              elif head_class == "PKCS12/DER blob":
                  print("::error::  diagnosis: the paste decodes toward a PKCS#12/DER blob, NOT a Java KeyStore — modern keytool defaults to PKCS12. Convert first:  keytool -importkeystore -srckeystore YOURSTORE.p12 -destkeystore arena.keystore -deststoretype JKS  then re-run  base64 -w0 arena.keystore  and re-paste.")
              elif head_class == "JKS":
                  print("::error::  diagnosis: content is JKS-headed but NO single-deletion reconstruction is structurally whole — the damage exceeds one stray character. Re-paste 'base64 -w0 arena.keystore' output exactly.")
              # safe diagnostics: format class + distinct out-of-alphabet chars — never content/positions
              if "BEGIN" in s[:12].upper():
                  print("::error::  classification: PEM text — base64-encode the KEYSTORE FILE, not PEM")
              elif s and all(c in "0123456789abcdefABCDEF" for c in s):
                  print("::error::  classification: hex dump — base64 the keystore file directly, not hex")
              elif len(s) < 1000:
                  print(f"::error::  classification: too short ({len(s)} chars) — a JKS is ~2–4 KB → ~3–6 KB base64")
              elif len(s) % 4 == 1:
                  print(f"::error::  classification: {len(s)} chars ≡ 1 mod 4 — one stray/duplicated character was pasted; single-stray recovery found no digest-valid JKS (needs REPLYMATE_KEYSTORE_PASS set correctly; >1 stray chars cannot be healed). Re-paste carefully.")
              else:
                  print(f"::error::  classification: {len(s)} chars, {s.count('%')} '%' signs.")
              ok = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=-_\"'\\%")
              bad = sorted({c for c in s if c not in ok})
              if bad:
                  print("::error::  out-of-alphabet characters present (distinct set only): " + " ".join(f"U+{ord(c):04X}" for c in bad))
              print("::error::correct value:  base64 -w0 arena.keystore  (Linux) /  base64 arena.keystore  (macOS) → paste the single-line output as the secret")
              sys.exit(1)
          if data[:4] != bytes.fromhex("feedfeed"):
              if data[:5] == b"-----":
                  hint = "decoded content is PEM text — the secret must cover the JKS *file* bytes"
              elif data[:2] == b"0\x82":
                  hint = "decoded content looks like a DER key/certificate, not a JKS — base64 the .keystore file itself"
              else:
                  hint = "decoded bytes are not a JKS store"
              print(f"::error::{hint}")
              sys.exit(1)
          if not jks_ok(data):
              print("::error::decoded bytes pass the JKS magic check but fail structural validation (corrupt/truncated keystore body)")
              sys.exit(1)
          dig_pw = PW_USED if PW_USED is not None else jks_digest_any(data)
          if dig_pw is None:
              if not PW_SHAPES:
                  print("::warning::REPLYMATE_KEYSTORE_PASS unset/empty — integrity-digest precheck skipped; the JVM unlock + fingerprint gate next step remains fail-closed")
              else:
                  print("::error::JKS integrity digest MISMATCH — the decoded keystore body does not validate against REPLYMATE_KEYSTORE_PASS under any paste-tolerant shape (wrong password, or corruption beyond a single stray character). Refusing to materialize.")
                  sys.exit(1)
          else:
              if dig_pw != RAW_PW:
                  print(f"::add-mask::{dig_pw}")
                  print("::warning::REPLYMATE_KEYSTORE_PASS needed whitespace normalization to validate this keystore's integrity digest — downstream steps use the normalized value; re-set the secret without stray whitespace/line-breaks next rotation")
              # hand the WORKING password shape to downstream steps via 0600 runner-temp file ONLY
              pwf = os.path.join(os.environ.get("RUNNER_TEMP", os.path.dirname(sys.argv[1]) or "."), ".kspw")
              with open(pwf, "w") as f:
                  f.write(dig_pw)
              os.chmod(pwf, 0o600)
          with open(sys.argv[1], "wb") as f:
              f.write(data)
          print(f"keystore materialized at runner-temp path ({len(data)} bytes, JKS structure + integrity digest valid)")
          PYEOF
          chmod 600 "$KS_OUT"
          echo "KS_PATH=$KS_OUT" >> "$GITHUB_ENV"

      - name: Verify keystore carries the HISTORICAL certificate (fail-closed)
        env:
          RM_KS_PASS: ${{ secrets.REPLYMATE_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          echo "::add-mask::$RM_KS_PASS"
          PW="$RUNNER_TEMP/.kspw"
          if [ ! -f "$PW" ]; then
            printf '%s' "$RM_KS_PASS" > "$PW"
          fi
          chmod 600 "$PW"
          if KS_PASS_FILE="$PW" bash scripts/verify_keystore.sh "$KS_PATH"; then
            echo "KEYSTORE-VERDICT: MATCH — historical ReplyMate identity confirmed"
          else
            rc=$?
            echo "::error::KEYSTORE-VERDICT: FAIL (exit $rc) — wrong key or password. Refusing to sign anything."
            exit 1
          fi

      - name: Build + sign APK with the verified historical key
        env:
          REPLYMATE_JKS_PASS: ${{ secrets.REPLYMATE_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          # the materialize step (when the digest validated) left the WORKING password
          # shape in a 0600 runner-temp file — prefer it over the raw secret
          if [ -f "$RUNNER_TEMP/.kspw" ]; then
            REPLYMATE_JKS_PASS="$(cat "$RUNNER_TEMP/.kspw")"
            export REPLYMATE_JKS_PASS
          fi
          VN="${{ inputs.version_name }}"
          VC="${{ inputs.version_code }}"
          APK="$RUNNER_TEMP/ReplyMate-$VN.apk"
          REPLYMATE_JKS="$KS_PATH" \
          VERSION_CODE="$VC" VERSION_NAME="$VN" \
            bash engine/build.sh "$PWD" "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "signed build complete: ReplyMate-$VN (vc$VC)"

      - name: Prove the APK itself carries the historical certificate
        run: |
          set -euo pipefail
          EXPECTED="$(printf '%s' "$HISTORICAL_FINGERPRINT" | tr -d ':' | tr 'a-f' 'A-F')"
          ACTUAL="$(bash scripts/apk_cert_fingerprint.sh "$APK_PATH")"
          echo "APK signing cert SHA-256 : $ACTUAL"
          echo "historical identity       : $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK-CERT-PROOF: MISMATCH — refusing to publish this artifact"
            exit 1
          fi
          echo "APK-CERT-PROOF: MATCH — update-in-place over ≤1.5.8 is preserved"
          SHA="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          {
            echo "### ReplyMate ${{ inputs.version_name }} (vc${{ inputs.version_code }}) — CI build"
            echo "- apk sha256: \`$SHA\`"
            echo "- size: $(stat -c%s "$APK_PATH") bytes"
            echo "- jvm gate: 757/757"
            echo "- keystore verdict: **MATCH** (historical identity)"
            echo "- apk cert proof: **MATCH** — \`B15F2F37FC…1C6A85ED\`"
            echo "- notes: ${{ inputs.notes }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage artifact for upload
        run: |
          set -euo pipefail
          mkdir -p release-out
          cp "$APK_PATH" "release-out/ReplyMate-${{ inputs.version_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReplyMate-${{ inputs.version_name }}-vc${{ inputs.version_code }}
          path: release-out/
          retention-days: 30

      - name: Destroy all key material (runs even on failure)
        if: always()
        run: |
          set -euo pipefail
          for f in "${KS_PATH:-}" "$RUNNER_TEMP/.kspw"; do
            [ -n "$f" ] && [ -e "$f" ] && { shred -u "$f" 2>/dev/null || rm -f "$f"; } || true
          done
          rm -f release-out/*.apk 2>/dev/null || true
          echo "temporary keystore + password file + workspace APK copy destroyed"
