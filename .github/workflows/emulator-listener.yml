name: emulator-listener

# ReplyMate Android-emulator listener harness. HARNESS ONLY:
#  * zero product-code changes (engine flag defaults off: the release path is
#    untouched; RM_DEBUG_MODE is set ONLY here and only stamps aapt2's output
#    binary so the harness can run-as/pull diagnostics from the test APK)
#  * isolated TEST signing: a fresh ephemeral key generated per run; the
#    production keystore/secrets are never referenced (asserted in logs)
#  * runs automatically for ANY PR changing these harness paths, and manually
#    via workflow_dispatch once present on the default branch
#
# Runs the real ReplyMate NotificationListenerService on a stock AOSP Android
# emulator against REAL NotificationManager notifications posted by PingPoster
# (installed as com.whatsapp / com.discord on a clean emulator with neither app
# present). All notification SHAPES are synthetic and labelled as such: this
# harness produces genuine-platform-delivery + real-ReplyMate-pipeline evidence.
# It is NOT genuine app-integration evidence and proves NOTHING about
# Oppo/ColorOS (which needs the owner's physical device).

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/emulator-listener.yml"
      - "tools/pingposter/**"
      - "tools/emulator/**"
      - "engine/build.sh"
  workflow_dispatch:
    inputs:
      api_level:
        description: "Android API level for the emulator"
        default: "34"
        required: false
      app_ref:
        description: "Optional git ref to build the ReplyMate APP from (candidate validation, e.g. a fix branch). Harness tools/workflows always come from the branch this workflow runs on; only the app-under-test swaps. Default '': build this branch's app."
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: emulator-listener-${{ github.ref }}
  cancel-in-progress: true

jobs:
  listener-scenarios:
    runs-on: ubuntu-latest
    # 45 was real-world insufficient (run 41345057505 hit it mid-S6 once the
    # WAL snapshot + verified grant ladder joined the loop); 90 leaves double
    # headroom even with every scenario red.
    timeout-minutes: 90
    # harness-only ephemeral signing key location. A plain runner-local path:
    # the `runner` context is NOT available at any env scope per GitHub's
    # context-availability rules (validated with actionlint) — nothing else
    # on the runner uses this directory, so isolation is still total and
    # production secrets stay unreferenced.
    env:
      REPLYMATE_SECRETS: /tmp/replymate-harness-keys
      # ubuntu runners ship a READ-ONLY preinstalled Android SDK at $ANDROID_HOME;
      # the engine would die trying to chmod/unzip the PINNED toolchain into it.
      # (Same fix release.yml already uses.) Pin our own writable dir.
      REPLYMATE_SDK: ${{ github.workspace }}/.engine-sdk
    steps:
      - name: "Checkout (harness branch — tools + workflow)"
        uses: actions/checkout@v4

      - name: Checkout app source (only when validating a candidate ref)
        if: ${{ inputs.app_ref != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref }}
          path: appsrc

      # Owner rule: the existing JVM gate runs UNCHANGED before any emulator
      # scenario, against the app actually under test.
      - name: Set up JDK 17 (gate)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: JVM gate (run_tests.sh) on the app under test
        run: |
          set -e
          APP_DIR="${{ inputs.app_ref != '' && 'appsrc' || '.' }}"
          echo "gating app source: $APP_DIR"
          chmod +x "$APP_DIR/scripts/run_tests.sh" || true
          ( cd "$APP_DIR" && bash scripts/run_tests.sh )

      - name: Verify KVM availability (explicit — never silently degrade)
        run: |
          set -e
          uname -r
          if [ ! -e /dev/kvm ]; then
            echo "FATAL: /dev/kvm ABSENT — this runner cannot hardware-accelerate the"
            echo "emulator; refusing to pretend otherwise (owner rule: verify KVM first)."
            exit 1
          fi
          ls -la /dev/kvm
          echo "KVM: PRESENT"

      - name: Build ReplyMate harness APK (ephemeral key + debug-mode)
        run: |
          set -e
          APP_DIR="${{ inputs.app_ref != '' && 'appsrc' || '.' }}"
          echo "building app source: $APP_DIR"
          if [ -n "${{ inputs.app_ref }}" ]; then
            # fix 18: the candidate's OWN engine/build.sh may predate
            # RM_DEBUG_MODE support. PROVEN: run 41491780011 built
            # arena/fix-listener-startup-anr with appsrc/engine/build.sh,
            # which silently IGNORED RM_DEBUG_MODE=1 → the installed APK had
            # flags=[HAS_CODE ALLOW_CLEAR_USER_DATA] (no DEBUGGABLE) → every
            # run-as kv evidence check was blind for the whole 25-min run
            # ('no such table: app_kv' everywhere was a PULL failure, not an
            # app failure). Overlay the harness-side build.sh: its ONLY delta
            # is the aapt2 --debug-mode stamp gated on RM_DEBUG_MODE (diffed
            # into this log for audit, every run). CI workspace only; the
            # candidate branch's bytes stay untouched.
            echo "=== audit diff: candidate engine/build.sh → harness engine/build.sh ==="
            diff "$APP_DIR/engine/build.sh" engine/build.sh || true
            echo "=== overlaying harness build.sh onto the candidate tree (workspace-only) ==="
            cp engine/build.sh "$APP_DIR/engine/build.sh"
          fi
          mkdir -p "$REPLYMATE_SECRETS"
          chmod +x "$APP_DIR/engine/build.sh" "$APP_DIR"/scripts/*.sh || true
          ( cd "$APP_DIR" && RM_DEBUG_MODE=1 VERSION_CODE=919 VERSION_NAME=1.7.2-emu-harness \
            bash engine/build.sh )
          APK="$APP_DIR/ReplyMate-1.7.2-emu-harness.apk"
          BT="$(dirname "$(find .engine-sdk/build-tools -name apksigner | head -1)")"
          HARNESS_SHA="$("$BT/apksigner" verify --print-certs "$APK" \
            | sed -n 's/.*SHA-256 digest: //p' | head -1)"
          echo "harness signing cert SHA-256: $HARNESS_SHA"
          PROD="b15f2f37fce19b564683fe6b85725a9d3192df93181ef2f36286b5e21c6a85ed"
          if [ "$HARNESS_SHA" = "$PROD" ]; then
            echo "FATAL: harness build was signed with the PRODUCTION key — aborting."
            exit 1
          fi
          echo "SIGNING ISOLATION OK: harness cert != production cert"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|debuggable" || true
          # fix 18 (build-side fail-fast): without the debuggable stamp every
          # run-as kv evidence check is blind. aapt2 badging does not print
          # the attribute — read the manifest xmltree directly.
          DBG_LINE="$("$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml 2>/dev/null \
            | grep -i debuggable || true)"
          echo "manifest debuggable attribute: ${DBG_LINE:-<absent>}"
          # aapt2 xmltree renders FLAG true as "=true" (aapt v1 prints 0xffffffff)
          # — accept both encodings (run 41499948914: stamp present as '=true'
          # while a 0xffffffff-only matcher wrongly aborted the build).
          if ! echo "$DBG_LINE" | grep -qE "(=true\b|0xffffffff)"; then
            echo "FATAL: harness APK is NOT stamped android:debuggable=true —"
            echo "RM_DEBUG_MODE plumbing broken; refusing to validate blind."
            exit 1
          fi
          echo "DEBUGGABLE STAMP OK: run-as kv evidence channel is available"
          mkdir -p evidence
          cp "$APK" evidence/

      - name: Build PingPoster (com.whatsapp + com.discord packages)
        run: |
          set -e
          chmod +x tools/pingposter/build.sh
          PP_PKG=com.whatsapp bash tools/pingposter/build.sh build/pingposter-com.whatsapp.apk
          PP_PKG=com.discord  bash tools/pingposter/build.sh build/pingposter-com.discord.apk
          cp build/pingposter-com.whatsapp.apk build/pingposter-com.discord.apk evidence/

      - name: Boot emulator + run scenarios (API ${{ inputs.api_level || '34' }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '34' }}
          target: default
          arch: x86_64
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: |
            set -e
            # android-emulator-runner runs EVERY SCRIPT LINE via its own sh -c —
            # variables never persist between lines (proven twice: runs
            # 41488017578 / 41490180194 both show APP_DIR empty after an explicit
            # assignment). The app path therefore goes INLINE per command,
            # resolved at Actions-expression time.
            chmod +x tools/emulator/run_scenarios.sh
            adb install -r "${{ inputs.app_ref != '' && 'appsrc' || '.' }}/ReplyMate-1.7.2-emu-harness.apk"
            adb install -r build/pingposter-com.whatsapp.apk
            adb install -r build/pingposter-com.discord.apk
            mkdir -p evidence
            RM_APP_REF="${{ inputs.app_ref }}" bash tools/emulator/run_scenarios.sh "$PWD/evidence" 2>&1 | tee evidence/runner.log

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-listener-evidence
          path: evidence/
          if-no-files-found: warn
